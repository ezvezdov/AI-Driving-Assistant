[project]
name = "AI-Driving-Assistant"
version = "0.1.0"
description = "A RAG-based chatbot that answers country-specific driving regulation questions using provided documents as its knowledge source."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45.0.6",
    "faiss-cpu>=1.11.0.post1",
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
    "langchain-huggingface>=0.3.1",
    "langchain-openai>=0.3.28",
    "pypdf>=5.9.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.0.0",
]
